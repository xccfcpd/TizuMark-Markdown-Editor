name: Build Windows

# Windows 安装包构建（NSIS 安装器 .exe + WiX .msi + 便携 exe）。
#
# 触发方式：
#   1) 推送 tag：v* （正式版本 → 构建 + 出 draft Release）或 build-win-* （临时构建，
#      只出 Artifacts，不建 Release，避免临时包污染 Releases 列表）
#   2) Actions 页面手动 Run workflow —— 注意 workflow_dispatch 的按钮只在该文件
#      已存在于【默认分支】时显示；仅在特性分支上时请用 tag 触发。
#
# 两路产出：
#   - Artifacts：TizuMark-windows-x64（14 天过期，便于随时下载验证）
#   - Release（仅 v* tag）：draft 形式，含 3 个包；到 Releases 页面人工确认后再点发布。
#     ⚠ 依赖两处权限：本文件顶部的 permissions: contents: write，
#       以及仓库 Settings → Actions → General → Workflow permissions = "Read and write"
#       （fork 默认常为只读，不改则创建 Release 时会 403）。
#
# 设计：本 workflow【不跑测试】（测试见 ci.yml），保证打包链路独立于测试状态，
#       测试红的时候也能出包。产物路径见 tauri.conf.json（bundle.targets = all）。

on:
  push:
    # 功能分支推送即出包（想省额度可去掉 branches，只用 tag 触发）。
    # 分支列表必须与 ci.yml 对齐：漏加工作分支会导致往它上面推送时**不产出安装包**，
    # 且没有任何提示（审计发现，2026-09-24）。
    branches: [master, main, copied-master, feat-diagram-engines, feat-updater-off, more-function]
    tags:
      - 'v*'
      - 'build-win-*'
  workflow_dispatch:

# 创建/更新 Release 需要写权限（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

# 同一 ref 上重复触发时取消旧运行
concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tauri build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 完整安装（devDeps 含 esbuild / @tauri-apps/cli，打包都要用）
      - name: Install dependencies (npm ci, full)
        run: npm ci

      - name: Install Rust (stable, msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ github.repository }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ github.repository }}-

      # npm run build = build:renderer + `tauri build`，
      # 结束后 package.json 的 postbuild 会再输出 TizuMark_<version>_x64.exe（便携版）。
      # tauri.conf.json 的 beforeBuildCommand 会自动跑 build:renderer && build:frontend。
      # 未配置代码签名证书，产物为未签名 exe（SmartScreen 会提示未知发布者，属预期）。
      - name: Build (tauri build)
        run: npm run build

      - name: List bundles
        shell: pwsh
        run: |
          Write-Host '=== bundle ==='
          Get-ChildItem -Recurse 'src-tauri/target/release/bundle' -File -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          Write-Host '=== portable exe ==='
          Get-ChildItem 'src-tauri/target/release/*.exe' -File -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TizuMark-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/TizuMark_*_x64.exe

      # ——— 以下两步仅对正式版本 tag（v*）生效，build-win-* 与本 workflow 手动触发均跳过 ———
      #
      # 发布前置校验：tag 名必须与代码里的版本号一致。
      # 项目已有 check-version.mjs 守护"版本号 8 处一致"，但它不看 tag；若打了 v1.2.4 而
      # package.json 仍是 1.2.3，就会出现"Release v1.2.4 里躺着 TizuMark_1.2.3_x64-setup.exe"
      # 这种错位，故在此补一道闸。
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::版本号一致性校验失败（8 处）'; exit 1 }
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($tag -ne $ver) {
            Write-Host "::error::tag v$tag 与 package.json 版本 $ver 不一致：请先把版本号升到 $tag（至少 package.json / tauri.conf.json / Cargo.toml 三处）"
            exit 1
          }
          Write-Host "tag/version OK: v$ver"

      # 发布 draft Release（人工到 Releases 页面点发布后才对外可见）。
      # 未做代码签名 → 包未签名，Release 说明由 GitHub 依据提交自动生成，可事后编辑补充
      # SmartScreen 提示与"已停用自动更新"的说明。
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'   # 允许下面 gh release view 的"不存在"失败被捕获
          $tag = '${{ github.ref_name }}'
          $assets = @()
          foreach ($pat in @('src-tauri/target/release/bundle/nsis/*.exe',
                             'src-tauri/target/release/bundle/msi/*.msi',
                             'src-tauri/target/release/TizuMark_*_x64.exe')) {
            $assets += @(Get-ChildItem $pat -File -ErrorAction SilentlyContinue)
          }
          $paths = @($assets | ForEach-Object { $_.FullName })
          if ($paths.Count -lt 3) {
            Write-Host "::error::预期至少 3 个安装产物，实际找到 $($paths.Count) 个：$($paths -join ', ')"
            exit 1
          }
          $paths | ForEach-Object { Write-Host "asset: $_" }

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在 → 补传/覆盖附件（可安全重跑）"
            gh release upload $tag @paths --clobber
          } else {
            Write-Host "Release $tag 不存在 → 新建 draft"
            gh release create $tag @paths --draft --verify-tag `
              --title "TizuMark $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::发布 Release 失败（检查仓库 Actions 写权限是否已开启）'; exit 1 }
          Write-Host "已创建/更新 draft Release：$tag（到 Releases 页面确认后点 Publish）"
