name: CI

on:
  push:
    # copied-master / feat-* ：fork 的工作分支，需要在本分支上直接跑 CI
    # （原本只在 master/main 触发，导致推送工作分支时 workflow 不被调度）。
    # more-function：2026-09 新增的工作分支，漏加会导致推送它时 CI 静默不调度
    # （push 事件的工作流定义取自被推送的提交，故本次补入后该次推送即会触发）。
    branches: [master, main, copied-master, feat-diagram-engines, feat-updater-off, more-function]
  pull_request:
    branches: [master, main, copied-master, feat-diagram-engines, feat-updater-off, more-function]
  # 手动触发入口（GitHub UI 的 Run workflow）；需该 workflow 已存在于【默认分支】才显示。
  # 注意：默认分支 master 上的 ci.yml 尚未包含 workflow_dispatch，故该按钮当前不可见。
  workflow_dispatch:

# 取消同一 ref 上的旧运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 完整安装（不 --omit=dev）：devDeps 含 esbuild/jsdom，test 与 build:renderer 都需要
      - name: Install dependencies (npm ci, full)
        run: npm ci

      # ADR-7：先本地可执行，CI 见 P1-8。
      # coupling-report / check-globals / entry-scripts / tauri-api 仅读源码，无需打包产物。
      - name: Coupling & global-export guards
        run: npm run check

      # npm test 的 pretest 钩子会自动执行 build:renderer 构建 unified-bundle，
      # 之后 run-tests.cjs 跑全部 test/*.test.cjs（含需 eval bundle 的集成用例）。
      #
      # 失败时把「失败用例名 + 失败摘要」写成 ::error:: 注解。原因：Actions 的原始日志
      # 需要登录才能查看，而注解可经 check-runs API 匿名读取 —— 这是无凭据环境下定位
      # 失败用例的唯一通道（曾因此只能靠猜）。注意 set +e：不让管道提前中止本步骤。
      - name: Run tests
        run: |
          set +e
          npm test 2>&1 | tee /tmp/tm-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            names=$(grep -E '^[[:space:]]*not ok ' /tmp/tm-test.log | head -8 | tr '\n' ';' | cut -c1-900)
            [ -z "$names" ] && names="(未匹配到 not ok)"
            echo "::error title=失败用例::${names}"
            detail=$(grep -n -A6 -E "not ok |name: '(Assertion|Type|Range)Error'" /tmp/tm-test.log | tail -26 | tr '\n' '|' | cut -c1-2600)
            [ -z "$detail" ] && detail=$(tail -n 30 /tmp/tm-test.log | tr '\n' '|' | cut -c1-2500)
            echo "::error title=失败摘要::${detail}"
            exit 1
          fi

      # P2-3：release 前端聚合冒烟——验证 dist/ 可生成（beforeBuildCommand 关键一环，
      # 若 build-frontend 在 CI 上坏掉，tauri build 会直接失败）
      - name: Frontend bundle smoke (build-frontend)
        run: npm run build-frontend

  rust:
    name: Rust (cargo test, optional)
    runs-on: ubuntu-latest
    # 可选关卡：Linux webkit 环境偶发不稳不应阻塞前端合并；失败仅作信号。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.repository }}-

      # Tauri v2 Linux 编译依赖
      - name: Install system dependencies
        run: |
          # runner 镜像预置的 Google Chrome 第三方源时常出现 Hash Sum mismatch，
          # 会让 apt-get update 以 exit 100 失败（cargo test 会被连带跳过）。与项目代码无关。
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test

  # 浏览器回归（真实 Chrome / 真实布局）：test/browser/ 下的用例验证的是 jsdom 天然测不到的
  # 滚动同步、勾选框跳动等「依赖真实排版引擎」的行为。此前它们在任何环境都不跑 ——
  # npm test 里检测不到 puppeteer-core 就整批跳过，CI 从来不装它，于是这类回归只能靠本机发现。
  #
  # 本关卡把「永远不跑」变成「跑了就报信号」，同时刻意做成**非阻塞**：
  #   - runner 镜像是否带 Chrome、puppeteer-core 能否装上，都会影响可用性；
  #   - 用例自身在缺环境时会 SKIP 并 exit 0（见 test/browser/*.test.cjs 开头），
  #     故这里额外检测 SKIP 并打 ::warning::，避免"绿色"被误读成"已验证"。
  browser:
    name: Browser regression (real Chrome, signal only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, full)
        run: npm ci

      # 刻意**不**写进 devDependencies：一旦装上，所有机器的 `npm test` 都会去跑浏览器用例，
      # 改变本地语义（本地范式见 ADR-7）。这里按需临时安装，仅本关卡可见。
      - name: Install puppeteer-core (ad-hoc, not saved)
        run: npm install --no-save puppeteer-core

      - name: Locate Chrome
        id: chrome
        run: |
          p=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          echo "path=$p" >> "$GITHUB_OUTPUT"
          [ -n "$p" ] || echo "::warning title=Chrome 缺失::runner 上未找到 Chrome，浏览器回归将被跳过（本关卡无实际覆盖）"

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Run browser tests
        env:
          PUPPETEER_MODULES: ${{ github.workspace }}/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          set +e
          node scripts/run-tests.cjs browser 2>&1 | tee /tmp/tm-browser.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q 'SKIP:' /tmp/tm-browser.log; then
            echo "::warning title=浏览器回归被跳过::检测到 SKIP：环境不满足（Chrome/puppeteer-core），本次无真实覆盖"
          fi
          exit "$status"
