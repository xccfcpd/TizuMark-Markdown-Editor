name: Sync package-lock

# 一次性 bootstrap：当本机没有 npm（无法本地更新 package-lock.json）而 package.json 新增了依赖时，
# 由 CI 执行 npm install 生成/更新 lock 并提交回指定分支——否则 npm ci 会因 lock 与 package.json
# 不一致而直接失败（仓库的 CI 与打包流程都用 npm ci）。
#
# 触发：推送 lock-* tag（避免给正式 tag 名添乱），或 Actions 页面手动 Run workflow。
# 注意：workflow_dispatch 的按钮只在该文件已存在于【默认分支】时显示，因此通常用 tag 触发。
# 提交使用 GITHUB_TOKEN（permissions: contents: write）；bot 推送不会再触发其它 workflow。

on:
  push:
    tags:
      - 'lock-*'
  workflow_dispatch:
    inputs:
      branch:
        description: 提交回的分支名
        required: false
        default: feat-diagram-engines

permissions:
  contents: write

jobs:
  sync-lock:
    name: Generate & commit package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm install（而非 ci）：容忍 lock 与 package.json 暂不一致，并据此重写 lock
      - name: Generate lockfile
        run: npm install --no-audit --no-fund

      - name: Commit lockfile back to branch
        shell: bash
        run: |
          set -e
          BRANCH="${{ github.event.inputs.branch || 'feat-diagram-engines' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(deps): 同步 package-lock.json（abcjs / echarts / wavedrom）"
          git push origin "HEAD:${BRANCH}"
          echo "已推送到 ${BRANCH}"
